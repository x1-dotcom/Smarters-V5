name: Bug report
description: Report reproducible incorrect behavior
title: "[BUG] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, tokens, customer data, private keys or other secrets.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version/commit, OS/runtime, device/app version and relevant server/runtime details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence level
      options:
        - PROVEN BY RUNTIME
        - PROVEN BY TEST
        - PROVEN BY SOURCE
        - INFERRED
        - UNKNOWN / UNPROVEN
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / screenshots
      description: Remove credentials, tokens, customer data and sensitive infrastructure details.
  - type: checkboxes
    id: boundary
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and sensitive customer/production data.
          required: true
