name: Finalize X1 Smarters public release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify public package
        shell: bash
        run: |
          cat .publish/part00.bin .publish/part01.bin .publish/part02.bin > X1_SMARTERS_PANEL_v1.3_PUBLIC_CLEAN_OBFUSCATED.tar.bz2
          echo "64ed75e560dc752080d65a19fb69c9c40178a915c6cf3995a69df3609997178b  X1_SMARTERS_PANEL_v1.3_PUBLIC_CLEAN_OBFUSCATED.tar.bz2" | sha256sum -c -
      - name: Finalize clean repository
        shell: bash
        run: |
          rm -rf .publish
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish X1 Smarters Panel v1.3"
          git push
